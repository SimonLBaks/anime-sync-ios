name: Core protocol tests without Simulator
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-core-protocols-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac-core-protocols:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: macos-15-intel
    timeout-minutes: 8
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CI_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate pinned compiler and actual-source package
        run: |
          test -d "$DEVELOPER_DIR"
          xcrun swift --version
          mkdir -p dist
          xcrun swift package dump-package > dist/core-package.json
      - name: Run actual Core protocol tests with a five-minute deadline
        timeout-minutes: 6
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          output = Path('dist')
          source = Path('Tests/ProtocolTests.swift').read_text(encoding='utf-8')
          fixture = re.search(r'^\s*#if DEBUG && !CORE_PROTOCOLS_ONLY\s*\n(.*?)^\s*#endif', source, re.M | re.S)
          assert fixture is not None, 'Missing explicit UI-fixture-only guard'
          method_pattern = r'^\s*func (test\w+)\('
          excluded_names = set(re.findall(method_pattern, fixture.group(1), re.M))
          assert len(excluded_names) == 3, 'Only the three UI fixture tests may be excluded'
          expected_names = set(re.findall(method_pattern, source, re.M)) - excluded_names
          expected_names |= set(re.findall(method_pattern, Path('Tests/AppConfigurationTests.swift').read_text(encoding='utf-8'), re.M))
          log_path = output / 'core-protocols.log'
          started = time.monotonic()
          timed_out = False
          # SwiftPM 6.1 emits xUnit evidence through its parallel runner. Two
          # workers run isolated XCTest processes without creating a simulator.
          command = ['xcrun', 'swift', 'test', '--parallel', '--num-workers', '2', '--xunit-output', str(output / 'core-protocols.xml')]
          with log_path.open('w', encoding='utf-8') as log:
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  result = process.wait(timeout=300)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  os.killpg(process.pid, signal.SIGTERM)
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=5)
                  log.write('\nCore protocol run exceeded its five-minute deadline.\n')
                  result = 124
          sys.stdout.write(log_path.read_text(encoding='utf-8', errors='replace'))
          cases = []
          report = output / 'core-protocols.xml'
          if report.exists():
              try:
                  cases = list(ET.parse(report).getroot().iter('testcase'))
              except ET.ParseError:
                  if result == 0:
                      result = 1
          failures = sum(case.find('failure') is not None or case.find('error') is not None for case in cases)
          skipped = sum(case.find('skipped') is not None for case in cases)
          actual_names = {case.attrib.get('name', '').split('.')[-1].removesuffix('()') for case in cases}
          if result == 0 and (len(cases) != len(expected_names) or actual_names != expected_names or failures or skipped):
              print(f'Expected {len(expected_names)} exact Core tests; got {len(cases)} cases, {failures} failures and {skipped} skips.')
              print('Missing methods:', sorted(expected_names - actual_names))
              print('Unexpected methods:', sorted(actual_names - expected_names))
              result = 1
          summary = {
              'revision': os.environ.get('CI_SOURCE_REVISION'),
              'command': command,
              'exit_code': result,
              'timed_out': timed_out,
              'duration_seconds': round(time.monotonic() - started, 2),
              'test_count': len(cases),
              'expected_test_count': len(expected_names),
              'expected_test_methods': sorted(expected_names),
              'executed_test_methods': sorted(actual_names),
              'failures': failures,
              'skipped': skipped,
              'scope': 'Actual eight Core source files and ProtocolTests.swift/AppConfigurationTests.swift; no source copies, simulator, provider, UI, AVPlayer or live backend.',
              'excluded_ui_fixture_tests': 3,
          }
          (output / 'core-protocols-summary.json').write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2))
          sys.exit(result)
          PY
      - name: Compile the actual production WebKit privacy rules
        timeout-minutes: 2
        run: |
          xcrun swiftc -swift-version 5 -D PROVIDER_RULES_ONLY AnimeSync/Core/AppConfiguration.swift AnimeSync/Provider/ProviderBridge.swift tools/check-webkit-rules.swift -o /tmp/anime-sync-provider-rules-check
          python3 tools/run-with-progress.py --timeout 60 --heartbeat 15 -- /tmp/anime-sync-provider-rules-check 2>&1 | tee dist/provider-rule-compiler.log
      - name: Save exact Core runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anime-sync-core-protocols-${{ github.sha }}
          path: dist/
          retention-days: 3
          if-no-files-found: error
